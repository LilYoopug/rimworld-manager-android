name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Sign and align release APK
        run: |
          keytool -genkey -keystore rimmanager.jks -alias rimmanager -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kovak,OU=Dev,O=LilYoopug,L=Internet,ST=CA,c=US" -storepass storepass -keypass storepass -sigalg SHA256withRSA
          zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-aligned.apk
          apksigner sign --ks rimmanager.jks --ks-pass pass:storepass --ks-key-alias rimmanager --key-pass pass:storepass app/build/outputs/apk/release/app-release-aligned.apk
          apksigner verify app/build/outputs/apk/release/app-release-aligned.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release-aligned.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rim-mod-manager-release
          path: app/build/outputs/apk/release/app-release-aligned.apk